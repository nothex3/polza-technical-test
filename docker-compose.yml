services:
  db:
    image: postgres:17-alpine
    container_name: polza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polza
      POSTGRES_USER: polza
      POSTGRES_PASSWORD: polza
    ports:
      - "5432:5432"
    volumes:
      - polza_pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polza -d polza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polza_pg_data:
